[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probsql"
version = "0.1.0"
description = "SQL extended with probabilistic queries, backed by a tabular foundation model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
    "duckdb",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]